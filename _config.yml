# GitHub Pages renders this repository as it is: README.md is the home page, every folder's README.md and SKILL.md its own
# page, and docs/ the longer pages, each owning one phrase. No second copy of anything; relative .md links become page links.
title: mudRPC, gRPC for unstable networks
description: gRPC's service model over mesh, radio and UDP as sealed packets, without HTTP/2 or a server stack.
theme: jekyll-theme-primer
plugins: [jekyll-relative-links]
exclude: [target, packages/conan, packages/vcpkg]
defaults:
  - scope: { path: "README.md" }
    values: { permalink: / }
