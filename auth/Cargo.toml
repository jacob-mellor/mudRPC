[package]
name = "mudrpc-auth"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "Per-sender authentication for mudRPC: SHA-512, Ed25519 and the signed sealer, no_std."
repository = "https://github.com/jacob-mellor/mudRPC"
keywords = ["grpc", "rpc", "mesh", "udp", "no-std"]
categories = ["network-programming", "embedded", "no-std"]

[lib]
path = "lib.rs"

[dependencies]
mudrpc-core = { path = "../core", version = "3.0.0" }

[dev-dependencies]
mudrpc-gcm = { path = "../gcm", version = "3.0.0" }
