[package]
name = "mudrpc-gcm"
version = "3.0.0"
edition = "2021"
license = "MIT"
description = "AES-256-GCM for mudRPC from FIPS 197 and SP 800-38D: bitsliced, no tables, no_std."
repository = "https://github.com/jacob-mellor/mudRPC"
keywords = ["grpc", "rpc", "mesh", "udp", "no-std"]
categories = ["network-programming", "embedded", "no-std"]

[lib]
path = "lib.rs"

[dependencies]
mudrpc-core = { path = "../core", version = "3.0.0" }
